# CI TagSearch — trois suites × Linux/Windows, parité entre langages, garde-fou de complexité.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q
        working-directory: python-engine

  javascript:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js-engine/package-lock.json
      - run: npm ci
        working-directory: js-engine
      - run: npm run typecheck
        working-directory: js-engine
      - run: npm test
        working-directory: js-engine
      - run: npm run build
        working-directory: js-engine

  php:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer
      - run: composer install --no-interaction --prefer-dist
        working-directory: php-engine
      - run: vendor/bin/phpunit
        working-directory: php-engine

  parity:
    name: Fichiers partagés à jour (jeu de référence, fixtures PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python shared-assets/generate_reference.py --check
      - run: python scripts/sync_fixtures.py --check

  complexity:
    name: Garde-fou de complexité de l'indexation (2N produits < x3 le temps de N)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python benchmarks/run.py --sizes 250 500 1000 2000 --queries 50 --check-ratio 3.0
