# Publication déclenchée par un tag vX.Y.Z — PyPI et npm en « trusted publishing » (OIDC, aucun jeton stocké).
# Packagist se met à jour tout seul par webhook GitHub sur le dépôt php-e-cormmerce-search (voir docs/RELEASE.md).
#
# Garde-fous : les jobs de publication exigent l'environnement « release » (approbation manuelle réglable
# dans Settings > Environments) et ne partent que si le tag égale la version déclarée dans les manifestes.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Republier un tag EXISTANT sans le déplacer (ex. rejouer npm après avoir configuré le publisher).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v1.0.1)"
        required: true
        type: string
      target:
        description: "Quoi publier"
        required: true
        default: npm
        type: choice
        options: [npm, pypi, both]

permissions:
  contents: read

jobs:
  verify:
    name: Vérifier tag = versions des manifestes, puis tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Le tag doit égaler les trois versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG#v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('python-engine/pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./js-engine/package.json').version")
          echo "tag=$tag python=$py js=$js"
          [ "$tag" = "$py" ] && [ "$tag" = "$js" ]
      - run: python -m pip install pytest build && python -m pytest -q
        working-directory: python-engine
      - run: npm ci && npm run typecheck && npm test
        working-directory: js-engine

  pypi:
    needs: verify
    if: github.event_name == 'push' || github.event.inputs.target != 'npm'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
        working-directory: python-engine
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-engine/dist/

  npm:
    needs: verify
    if: github.event_name == 'push' || github.event.inputs.target != 'pypi'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # OIDC : npm « trusted publishing », aucun jeton stocké
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Le trusted publishing exige npm >= 11.5.1.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci && npm publish --access public
        working-directory: js-engine
